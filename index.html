<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文中704段考成績多維度分析系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .font-fun { font-family: 'ZCOOL KuaiLe', 'Noto Sans TC', sans-serif; }
        body { font-family: 'Noto Sans TC', sans-serif; }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-bounce-slow { animation: bounce-slow 2s ease-in-out infinite; }
    </style>
</head>
<body class="bg-amber-50/60 min-h-screen p-3 sm:p-6 relative overflow-x-hidden">

    <div class="max-w-xl mx-auto bg-white/95 backdrop-blur-md rounded-3xl shadow-xl overflow-hidden p-4 sm:p-8 border-4 border-amber-200 relative my-2">
        
        <div class="text-center mb-5">
            <div class="flex justify-center items-center gap-2 mb-1">
                <span class="text-3xl animate-bounce-slow">🌿</span>
                <h1 class="text-xl sm:text-3xl font-extrabold text-amber-900 font-fun tracking-wide">
                    文化國中704段考成績查詢
                </h1>
                <span class="text-3xl animate-bounce-slow" style="animation-delay: 1s;">🌸</span>
            </div>
            <p class="text-gray-600 text-xs sm:text-sm">一同關心孩子的學習，快樂成長！</p>
        </div>

        <!-- 登入表單 -->
        <div id="login-box" class="space-y-4 max-w-sm mx-auto bg-gradient-to-b from-amber-50/80 to-emerald-50/50 p-5 rounded-2xl border-2 border-amber-300 shadow-inner relative">
            <div>
                <label class="block text-amber-900 font-bold mb-1.5 text-sm flex items-center gap-1.5">
                    <span>🌱</span> 選擇您的帳號：
                </label>
                <select id="user-select" class="w-full border-2 border-amber-200 rounded-xl p-2.5 bg-white focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 outline-none transition text-sm font-medium">
                    <option value="">-- 考生座號姓名 --</option>
                </select>
            </div>
            <div>
                <label class="block text-amber-900 font-bold mb-1.5 text-sm flex items-center gap-1.5">
                    <span>🌸</span> 請輸入考生身分證末5碼數字：
                </label>
                <input type="password" id="password-input" class="w-full border-2 border-amber-200 rounded-xl p-2.5 bg-white focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 outline-none transition text-sm" placeholder="請輸入密碼">
            </div>
            <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3 rounded-xl transition shadow-md text-base font-fun tracking-wider flex items-center justify-center gap-2">
                <span>🚀</span> 檢視學習成果
            </button>
        </div>

        <!-- 查詢後的儀表板 -->
        <div id="dashboard" class="hidden space-y-6 mt-2">
            <div class="flex justify-between items-center border-b-2 border-amber-100 pb-3">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🌻</span>
                    <h2 id="welcome-msg" class="text-base sm:text-xl font-bold text-amber-900 font-fun"></h2>
                </div>
                <button onclick="location.reload()" class="bg-rose-400 hover:bg-rose-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition shadow-sm flex items-center gap-1">
                    <span>🚪</span> 登出
                </button>
            </div>

            <!-- 分析卡片 -->
            <div class="bg-gradient-to-r from-amber-50/80 via-emerald-50/60 to-sky-50/80 border-2 border-emerald-300 p-4 rounded-2xl shadow-sm relative space-y-3">
                <div class="absolute -top-3 right-4 bg-emerald-500 text-white text-xs font-bold px-3 py-0.5 rounded-full shadow">
                    ✨ AI 分析報告
                </div>
                <div class="flex flex-col gap-2 pt-1">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-emerald-900 text-sm sm:text-base flex items-center gap-1.5">
                            <span>📊</span> 成績表現與中位數比較
                        </h3>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-amber-900 mr-2">選擇考次：</label>
                        <select id="exam-select" onchange="updateAnalysis()" class="border-2 border-amber-200 rounded-xl px-2.5 py-1 bg-white text-xs sm:text-sm font-medium focus:ring-2 focus:ring-emerald-400 outline-none"></select>
                    </div>
                </div>
                <div id="analysis-content" class="text-gray-700 space-y-2 text-xs sm:text-sm bg-white/70 p-3 rounded-xl border border-amber-100"></div>
            </div>

            <!-- 圖表一：歷次趨勢 -->
            <div class="bg-white p-4 border-2 border-amber-100 rounded-2xl shadow-sm">
                <h3 class="font-bold text-amber-900 mb-3 text-center font-fun text-sm sm:text-base">📈 歷次段考成績變化趨勢</h3>
                <div class="w-full overflow-x-auto">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- 圖表二：與中位數差距 -->
            <div class="bg-white p-4 border-2 border-amber-100 rounded-2xl shadow-sm">
                <h3 class="font-bold text-amber-900 mb-3 text-center font-fun text-sm sm:text-base">📊 各科與班級「中位數」差距 (分)</h3>
                <div class="w-full overflow-x-auto">
                    <canvas id="diffChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 僅保留座號與姓名在前端，讓下拉選單秒開，完全不包含密碼
        const studentList = [
            { id: "01", name: "01李岱臻" }, { id: "02", name: "02林永喜" },
            { id: "03", name: "03林品妍" }, { id: "04", name: "04林品璇" },
            { id: "05", name: "05林妤晴" }, { id: "06", name: "06邱子芯" },
            { id: "07", name: "07張采穎" }, { id: "08", name: "08張祐瑄" },
            { id: "09", name: "09陳依槿" }, { id: "10", name: "10劉憶萱" },
            { id: "11", name: "11賴沛金" }, { id: "12", name: "12賴苡安" },
            { id: "13", name: "13謝苡柔" }, { id: "15", name: "15王辰祐" },
            { id: "16", name: "16林弘鎰" }, { id: "17", name: "17林裕鈁" },
            { id: "18", name: "18邱渤洲" }, { id: "19", name: "19紀    杰" },
            { id: "20", name: "20張承煜" }, { id: "21", name: "21陳佑睿" },
            { id: "22", name: "22陳利昌" }, { id: "23", name: "23游尚睿" },
            { id: "24", name: "24楊佳恩" }, { id: "25", name: "25賴誠恩" },
            { id: "26", name: "26鍾牧辰" }
        ];

        const API_URL = "https://script.google.com/macros/s/AKfycbyN5FlODeMVI8KmcMeye5KOrOWDVAP_CIty4-UObMUxEvU1JDRx-sANEhLO_rdq2Fd_aw/exec"; // 請替換為您的 Apps Script 網址

        let globalData = null;
        let currentUser = null;
        let trendChartInstance = null;
        let diffChartInstance = null;

        // 頁面一載入瞬間填入選單
        window.onload = function() {
            let select = document.getElementById('user-select');
            studentList.forEach(student => {
                let opt = document.createElement('option');
                opt.value = student.id;
                opt.textContent = student.name;
                select.appendChild(opt);
            });
        };

        // 登入驗證（點擊後向 Google 試算表後端發請求比對密碼）
        async function handleLogin() {
            let selectedAccount = document.getElementById('user-select').value;
            let passwordInput = document.getElementById('password-input').value.trim();

            if (!selectedAccount) {
                alert("請先選擇您的帳號！");
                return;
            }
            if (!passwordInput) {
                alert("考生身分證末5碼數字");
                return;
            }

            let loginBtn = document.querySelector("#login-box button");
            let originalText = loginBtn.innerHTML;
            loginBtn.innerHTML = "<span>⏳</span> 等待～哦～最真的愛～";
            loginBtn.disabled = true;

            try {
                if (!globalData) {
                    let res = await fetch(API_URL);
                    globalData = await res.json();
                }

                // 從 Google 試算表的 accounts (密碼表) 比對
                let accounts = globalData.accounts;
                let isValid = false;
                let studentName = "";

                for (let i = 1; i < accounts.length; i++) {
                    let dbAccountFull = String(accounts[i][0]).trim(); // A欄：例如 "67邱詠仲"
                    let dbPassword = String(accounts[i][1]).trim();     // B欄：密碼

                    if (dbAccountFull.startsWith(selectedAccount) && dbPassword === passwordInput) {
                        isValid = true;
                        studentName = dbAccountFull;
                        break;
                    }
                }

                if (isValid) {
                    currentUser = { account: selectedAccount, name: studentName };
                    document.getElementById('login-box').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    document.getElementById('welcome-msg').textContent = `歡迎，${studentName}！`;
                    initDashboard();
                } else {
                    alert("密碼為考生身分證末5碼，請重新輸入數字！");
                    loginBtn.innerHTML = originalText;
                    loginBtn.disabled = false;
                }
            } catch (err) {
                alert("等到花兒也謝了～ 您的網路撥號中嗎？");
                console.error(err);
                loginBtn.innerHTML = originalText;
                loginBtn.disabled = false;
            }
        }

        function initDashboard() {
            let examSelect = document.getElementById('exam-select');
            examSelect.innerHTML = "";
            
            Object.keys(globalData.scores).forEach(examName => {
                let rows = globalData.scores[examName];
                if (rows && rows.length > 1) {
                    let opt = document.createElement('option');
                    opt.value = examName;
                    opt.textContent = examName;
                    examSelect.appendChild(opt);
                }
            });

            renderTrendChart();
            updateAnalysis();
        }

        function getMedian(arr) {
            let nums = arr.filter(n => !isNaN(n) && n !== null).sort((a, b) => a - b);
            if (nums.length === 0) return 0;
            let mid = Math.floor(nums.length / 2);
            if (nums.length % 2 === 0) {
                return (nums[mid - 1] + nums[mid]) / 2;
            } else {
                return nums[mid];
            }
        }

        function calculateClassRankings(rows, header) {
            let subjects = ["國文", "英語", "數學", "社會", "自然"];
            let idxMap = {};
            header.forEach((h, idx) => { idxMap[h.toString().trim()] = idx; });

            let studentTotals = [];
            for (let i = 1; i < rows.length; i++) {
                let name = rows[i][0];
                if (!name) continue;
                let sum = 0;
                subjects.forEach(sub => {
                    sum += Number(rows[i][idxMap[sub]]) || 0;
                });
                studentTotals.push({ name: name, total: sum });
            }

            studentTotals.sort((a, b) => b.total - a.total);

            let myRank = "-";
            let totalStudents = studentTotals.length;
            for (let i = 0; i < studentTotals.length; i++) {
                if (studentTotals[i].name.includes(currentUser.name) || currentUser.name.includes(studentTotals[i].name)) {
                    myRank = i + 1;
                    break;
                }
            }
            return { rank: myRank, totalStudents: totalStudents };
        }

        function renderTrendChart() {
            let exams = Object.keys(globalData.scores).filter(e => globalData.scores[e].length > 1);
            let subjects = ["國文", "英語", "數學", "社會", "自然"];
            let studentName = currentUser.name;

            let subjectData = { "國文": [], "英語": [], "數學": [], "社會": [], "自然": [] };

            exams.forEach(exam => {
                let rows = globalData.scores[exam];
                let header = rows[0];
                let idxMap = {};
                header.forEach((h, idx) => { idxMap[h.toString().trim()] = idx; });

                let found = false;
                for (let i = 1; i < rows.length; i++) {
                    if (rows[i][0].toString().includes(studentName)) {
                        subjects.forEach(sub => {
                            subjectData[sub].push(Number(rows[i][idxMap[sub]]) || 0);
                        });
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    subjects.forEach(sub => subjectData[sub].push(null));
                }
            });

            let colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
            let datasets = subjects.map((sub, idx) => ({
                label: sub,
                data: subjectData[sub],
                borderColor: colors[idx],
                backgroundColor: colors[idx],
                tension: 0.2,
                fill: false
            }));

            let ctx = document.getElementById('trendChart').getContext('2d');
            if (trendChartInstance) trendChartInstance.destroy();
            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: exams, datasets: datasets },
                options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }

        function updateAnalysis() {
            let selectedExam = document.getElementById('exam-select').value;
            if (!selectedExam) return;

            let rows = globalData.scores[selectedExam];
            let header = rows[0];
            let idxMap = {};
            header.forEach((h, idx) => { idxMap[h.toString().trim()] = idx; });

            let studentRow = null;
            for (let i = 1; i < rows.length; i++) {
                if (rows[i][0].toString().includes(currentUser.name)) {
                    studentRow = rows[i];
                    break;
                }
            }

            if (!studentRow) {
                document.getElementById('analysis-content').innerHTML = "查無此考次的個人成績資料。";
                return;
            }

            let rankInfo = calculateClassRankings(rows, header);
            let subjects = ["國文", "英語", "數學", "社會", "自然"];
            let scores = {};
            let prValues = {};
            let totalScore = 0;
            let classMedians = {};

            subjects.forEach(sub => {
                let subIdx = idxMap[sub];
                let prIdx = idxMap[sub + "PR"];
                
                scores[sub] = Number(studentRow[subIdx]) || 0;
                prValues[sub] = prIdx !== undefined ? (Number(studentRow[prIdx]) || "-") : "-";
                totalScore += scores[sub];

                let subScoresArr = [];
                for (let i = 1; i < rows.length; i++) {
                    let sVal = Number(rows[i][subIdx]);
                    if (!isNaN(sVal)) subScoresArr.push(sVal);
                }
                classMedians[sub] = getMedian(subScoresArr);
            });

            let studentAvg = (totalScore / subjects.length).toFixed(1);

            let diffs = {};
            subjects.forEach(sub => {
                diffs[sub] = Number((scores[sub] - classMedians[sub]).toFixed(1));
            });

            let sortedSubjects = [...subjects].sort((a, b) => diffs[b] - diffs[a]);
            let strongest = sortedSubjects[0];
            let weakest = sortedSubjects[sortedSubjects.length - 1];

            let html = `<div class="space-y-1">`;
            html += `<p class="font-semibold text-gray-800">📌 個人總分平均：<span class="text-blue-600 font-bold">${studentAvg} 分</span></p>`;
            html += `<p class="font-semibold text-gray-800">🏆 班級總分排名：<span class="text-emerald-600 font-bold">第 ${rankInfo.rank} 名</span> / 共 ${rankInfo.totalStudents} 人</p>`;
            html += `<p class="pt-1">🌟 <b>強項科目：</b> <span class="text-emerald-600 font-bold">${strongest}</span> (${scores[strongest]}分，高於中位數 <span class="text-emerald-600 font-bold">${diffs[strongest] >= 0 ? '+' + diffs[strongest] : diffs[strongest]} 分</span>)</p>`;
            html += `<p>🌱 <b>需加強科目：</b> <span class="text-amber-700 font-bold">${weakest}</span> (${scores[weakest]}分，相對於中位數 <span class="text-amber-700 font-bold">${diffs[weakest] >= 0 ? '+' + diffs[weakest] : diffs[weakest]} 分</span>)</p>`;
            
            let details = subjects.map(sub => `${sub}: ${scores[sub]}分(中位數差${diffs[sub] >= 0 ? '+' + diffs[sub] : diffs[sub]})`).join("<br>");
            html += `<div class="text-xs text-gray-500 mt-2 border-t pt-2 space-y-0.5"><span class="font-bold">各科與中位數比較：</span><br>${details}</div>`;
            html += `</div>`;

            document.getElementById('analysis-content').innerHTML = html;

            let diffValues = subjects.map(sub => diffs[sub]);
            let bgColors = diffValues.map(v => v >= 0 ? 'rgba(16, 185, 129, 0.7)' : 'rgba(245, 158, 11, 0.7)');

            let ctx = document.getElementById('diffChart').getContext('2d');
            if (diffChartInstance) diffChartInstance.destroy();
            diffChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: subjects,
                    datasets: [{
                        label: '相對於班級中位數差距 (分)',
                        data: diffValues,
                        backgroundColor: bgColors,
                        borderWidth: 1
                    }]
                },
                options: { 
                    responsive: true, 
                    scales: { y: { grid: { color: '#f3f4f6' } } } 
                }
            });
        }
    </script>
</body>
</html>
